# 標準CI呼び出し（実体: https://github.com/sinoda1114/ci-standard）
# main push 時の検証は deploy.yml 内の CI ジョブが担うため、ここは PR のみ。
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # secrets: inherit は付けない（最小権限。標準CIはシークレット不使用、値は .github/ci.env 供給）
    uses: sinoda1114/ci-standard/.github/workflows/node-ci.yml@main
